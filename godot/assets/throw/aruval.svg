<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- An aruval (அருவாள்), the long Tamil billhook: drawn for this game in the style of the
       Noto emoji beside it. Upright it has the wooden handle below and the blade above, its
       end curling forward over the edge; it is then leaned like the knife emoji. -->
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#eef2f6"/>
      <stop offset="0.55" stop-color="#c3ccd6"/>
      <stop offset="1" stop-color="#8794a3"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a9713b"/>
      <stop offset="0.5" stop-color="#8a5526"/>
      <stop offset="1" stop-color="#5e3815"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffe082"/>
      <stop offset="0.5" stop-color="#e0a92e"/>
      <stop offset="1" stop-color="#a8741a"/>
    </linearGradient>
  </defs>
  <g transform="rotate(38 64 66)">
    <!-- blade: the spine up the left, curling over to the hooked end, the edge back down the right -->
    <path d="M57 88 L55.5 44 C55 26 60 11 76 7 C86 4.5 95 8 94 16.5 C88 13.5 82 15.5 79 22 C80.5 38 76 62 72 88 Z"
          fill="url(#steel)" stroke="#5b6672" stroke-width="2.2" stroke-linejoin="round"/>
    <!-- the sharpened edge catches the light -->
    <path d="M79 22 C80.5 38 76 62 72.2 86" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" opacity="0.9"/>
    <path d="M60 80 L59 46 C58.5 33 61.5 22 69 15" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" opacity="0.55"/>
    <!-- brass collar where the blade meets the handle -->
    <rect x="54" y="86" width="21" height="9" rx="2.5" fill="url(#brass)" stroke="#7a5310" stroke-width="1.6"/>
    <!-- wooden handle with a brass ring near its end -->
    <rect x="56.5" y="94" width="16" height="31" rx="6" fill="url(#wood)" stroke="#3e240c" stroke-width="1.8"/>
    <rect x="55.5" y="114" width="18" height="4.5" rx="2" fill="url(#brass)" stroke="#7a5310" stroke-width="1.2"/>
    <circle cx="64.5" cy="103" r="1.8" fill="#ffe082" stroke="#7a5310" stroke-width="0.8"/>
  </g>
</svg>
